<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121212">
<title>Songlinks</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root {
  --bg: #121212; --surface: #181818; --surface2: #282828; --text: #ffffff; --muted: #b3b3b3;
  --line: #2f2f2f; --accent: #1ed760; --on-accent: #000000; --danger: #ff7b72;
  --head: "Circular Std", "Helvetica Neue", Helvetica, Arial, system-ui, sans-serif;
  color-scheme: dark;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; max-width: 100%; overflow-x: hidden; }
*, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
body { margin: 0; height: 100%; height: 100dvh; max-width: 100%; background: var(--bg); color: var(--text);
  font-family: var(--head); font-size: 16px; line-height: 1.4; overflow: hidden; overscroll-behavior: none; }
button { font: inherit; color: inherit; cursor: pointer; transition: transform .12s ease, opacity .12s ease, background-color .12s ease; }
button:active:not(:disabled) { transform: scale(0.96); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg { display: block; width: 24px; height: 24px; fill: currentColor; }
svg.stroke { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
